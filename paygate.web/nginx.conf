server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes that don't match a real file serve index.html
    # so React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets forever — Vite adds content hashes to filenames
    location ~* \.(js|css|woff2|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
